[project]
name = "pythonProject21"
version = "0.1.0"
description = ""
authors = [
    {name = "Irina Kovalenko",email = "kiris-83@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.0.1,<10.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core >= 2.0.0, < 3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=4.0.0,<5.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)"
]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[tool.poetry.group.lint.dependencies]
flake8 = "^4.0.0"
black = "^25.9.0"
isort = "^7.0.0"
mypy = "^1.18.2"


[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true


[tool.black]
line-length = 119


[tool.isort]
line_length = 119


#[tool.coverage.run]
#omit = ["*/tests/*",
#"*/tests",
#]